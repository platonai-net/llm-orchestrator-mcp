id: socratic
specVersion: 2

mission: >-
  Make the user give birth to their own thought: question their premises, expose
  their contradictions, put their thesis to the test with an advocate and a
  prosecutor, and hand them back a set of questions — never a conclusion.
  Produces no artifact, does not decide, does not answer in the human's place.

# ---------------------------------------------------------------------------
# Form
# ---------------------------------------------------------------------------
# `pipeline` with a single refutation stage — and NOT `adversarial`, and NOT
# `loop`.
#
# Not `adversarial`: that topology ends with a stage that DECIDES from the
# surviving objections. Deciding is exactly the act this kyber forbids to all of
# its roles. The refutation machine is indeed there — `adversarial: true` on the
# `refutation` stage — but the form does not commit to a final verdict: it hands
# control back to the human. Declaring `adversarial` would import a doctrine of
# conclusion that the mission contradicts.
#
# Not `loop` either: a loop would run producer and critic against each other
# BETWEEN AGENTS and would converge on their agreement — and an agreement
# between agents is a conclusion, reached without the human. This kyber's loop
# does exist, but it is the user's: it plays out BETWEEN two invocations (the
# questions rendered at the `handback` stage become the input of the next
# invocation), not inside a `for` bounded by `maxRounds`. See the
# `kyber-topology` skill.
topology: pipeline

# `required` and not `none`: a socratic kyber that does not question the human
# is a contradiction in terms. The orchestrator MUST interrogate the human
# before composing — and the `elucidation` stage below is that questioning made
# visible, with a deliverable of its own: a set of questions.
elucidation: required
maxDepth: 1

stages:
  # Deliverable of this stage: A SET OF QUESTIONS. Not an answer, not a lead,
  # not a plan. It is the only possible entry stage, therefore the one where the
  # human enters the machine.
  #
  # The ENTRY GATE, and this is where the doctrine wants it: nothing starts
  # before the human has answered. An entry gate has no `inputs` by definition;
  # the grammar now accepts it, and the validator checks that a downstream stage
  # actually consumes it — without which it would guard nothing.
  - id: elucidation
    roles: [questioner]
    mode: once
    gate: true

  # The middle gate, and it is placed where it counts too: no camp fights a
  # thesis that has not first been restated in its strongest form. This is the
  # most concrete socratic rule of the lot — a thesis attacked before it is
  # understood is a straw man, and a straw man teaches nobody anything.
  #
  # Two gates, two distinct roles: the first guards the entry (we do not work
  # without an answer), the second guards the refutation (we do not attack a
  # misunderstood thesis). They do not do the same job.
  - id: reformulation
    roles: [restater]
    mode: once
    inputs: [elucidation]
    gate: true

  # The adversarial test. `adversarial: true` marks the stage as the one that
  # REFUTES — here, the user's thesis, received from the upstream stage.
  #
  # `cap: 2` bounds the stage to its two camps, and this is not a comfort
  # ceiling: the advocate and the prosecutor work on the SAME input and must NOT
  # see each other's work. Two camps that read each other converge, and a
  # convergence between the advocate and the prosecutor is a conclusion obtained
  # by another path — precisely what this kyber refuses.
  - id: refutation
    roles: [advocate, prosecutor]
    mode: once
    inputs: [reformulation]
    adversarial: true
    cap: 2

  # The return to the human. This stage receives the objections AND the restated
  # thesis: it must be able to say what the thesis already withstands, not only
  # what strikes at it. It renders a second set of questions — the one for the
  # next round.
  - id: handback
    roles: [renderer]
    mode: once
    inputs: [refutation, reformulation]

# ---------------------------------------------------------------------------
# Deliberate absence of `definitionOfDone`
# ---------------------------------------------------------------------------
# NO stage declares a `definitionOfDone`, and that is an observation, not an
# oversight. The completion criterion of this kyber is not a property of a file:
# it is "does the user still hold their thesis, and for the same reasons?". That
# is observed in a head, not in a command's output.
#
# Writing a command here would be prose disguised as a command — which
# `lint.cjs` refuses on principle ("a DoD that no command can verify is not a
# DoD"). Working around it by writing `grep -c '?' <output>` would verify the
# presence of a question mark, not the absence of a conclusion: one
# counter-example is enough to show it, since "so your thesis is false, no?"
# passes the test.
#
# CONSEQUENCE, to be stated and not hidden: nothing mechanically verifies that a
# run of this kyber succeeded. That is the price of its form, and it is more
# honest than fabricating an artifact — a file of questions — only in order to
# have something to measure.

# ---------------------------------------------------------------------------
# Roles — five genuinely distinct trades, two of them opposed
# ---------------------------------------------------------------------------
# `role:` carries a REUSABLE SPECIALTY, never the `id`. The two camps carry
# different specialties (`advocate` / `prosecutor`) and that is deliberate:
# `kyber-memory` keys its learned memory on that specialty, and a learned
# preference for the advocate would silently apply to the prosecutor, whose
# trade is to contradict him. See INSTALL.md §1.
roles:
  - id: questioner
    role: interviewer
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You are the one who makes them say, not the one who knows. You produce a
      SET OF QUESTIONS from what the user has just asserted: open questions,
      ordered, each one aiming at an unstated premise, an undefined term, or a
      consequence they have not looked at yet. Each question is answerable:
      "what do you mean by X?", "what would be different if it were false?",
      "from what do you know it?". You FORBID yourself to answer, to suggest an
      answer, to complete their sentence in their place, and to ask a closed
      question. You never correct frontally: if you see a mistake, you do not
      name it, you ask the question that makes it visible. A set of questions is
      not a set of clues toward a good answer, and it does not end with your
      proposal — it ends with your most useful question, framed by
      <relance>...</relance>.

  - id: restater
    role: reformulator
    needs: { modality: text, tier: balanced, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You restate the thesis in its STRONGEST form, as the user would defend it
      themselves if they had the time to defend it. You produce three things:
      the thesis reformulated in their own terms (not yours), the list of
      UNSTATED premises it depends on, and the terms it uses without defining
      them. You FORBID yourself to improve it, to repair it, to qualify it, and
      to say whether it is true. Your output is the input of both camps: if you
      correct the thesis while restating it, they will attack and defend a
      thesis that nobody holds, and the entire refutation will be worth nothing.
      A premise you cannot name is written "missing premise" — you do not
      fabricate it.

  - id: advocate
    role: advocate
    needs: { modality: text, tier: balanced, context: standard }
    provider: zai-coding-cn
    model: glm-5.3
    prompt: >-
      You defend the user's thesis — not because it is true, but because a
      thesis must be tested in its strongest version. You produce the best
      possible case FOR it: the most favorable reading of each element, what
      would have to be true for it to hold, and the objections it already
      withstands without breaking. You FORBID yourself to approve of it: you
      never say it is true, you do not recommend it, and you do not sign your
      case with an opinion. Above all you FORBID yourself to invent — a fact, a
      figure or an authority that the user has not provided does not enter your
      case. If their defense is missing a piece, you name the missing premise
      instead of supplying it: defending it by completing it is defending it in
      their place, and it is no longer their thesis.

  - id: prosecutor
    role: prosecutor
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: kimi-k3
    prompt: >-
      You attack the user's thesis. You look for what makes it give way:
      internal contradictions, unstated premises, consequences they have not
      accepted, over-broad generalizations, examples that contradict it. You
      produce OBJECTIONS, each one naming the exact premise it strikes and
      quoting the exact words of the user that ground it — an objection without
      a quotation is an opinion, you withdraw it. Each objection is phrased as a
      question they will have to answer, not as a verdict. You FORBID yourself
      to conclude: "so your thesis is false" is forbidden, that is the user's
      decision and not yours. You FORBID yourself to attack the person, their
      competence or their motives — you attack the argument. And you FORBID
      yourself to attack a thesis you have not received restated: you work on
      the upstream stage, never on your reconstruction of what they meant.

  - id: renderer
    role: facilitator
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: glm-5.3-flash
    prompt: >-
      You hand control back to the user. You produce the state of their thesis
      after the refutation: what it now rests on, the objections it already
      withstands, those it has not yet answered, and the exact places where it
      is up to THEM to choose. Then you render a NEW SET OF QUESTIONS — the next
      round, the one they take away with them. You attribute each objection to
      its author and each defense to its own: you do not merge them into a
      "balanced view", because a synthesis is a disguised conclusion. You FORBID
      yourself to conclude, to arbitrate, to name a winning camp, to recommend a
      next step and to decide in their place. You FORBID yourself to tell them
      what you think of their thesis. Your output ends with a question, never
      with a verdict — if you cannot manage to end on a question, you have
      failed, and you say so.

memory: socratic

skills:
  - kyber-topology
  - kyber-routing
  - kyber-memory

# Connector requirements: NONE. This kyber works on what the human says. Its
# corpus is the user's speech, not a repository, not a file. Do not declare a
# connector the roles do not need: on another platform, every entry must be
# installed or reported as unavailable.
tools: []
