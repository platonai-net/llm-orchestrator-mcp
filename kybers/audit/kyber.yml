id: audit
specVersion: 2

mission: >-
  Audit a repository, a service or a process to produce findings that
  SURVIVE refutation: every finding carries a `file:line` anchor and a command
  that reproduces the defect, an adversarial stage is paid to break it, and only
  the survivors enter the report — the refuted ones go to an appendix with the
  reason for their refutation. Fix nothing, deploy nothing, arbitrate no product
  choice, write no product documentation.

# Shape: adversarial pipeline. The refuter runs AFTER the findings and receives
# their output in `inputs`; it is the dependency, not the declaration, that makes
# it a refuter. Launched in parallel with its target, it would have nothing to
# break and the team would degenerate into "N opinions in parallel", which is
# exactly what this line of work exists to prevent (INSTALL.md §3, `adversarial`
# topology).
topology: adversarial

# `none`, and that is a judgement: an audit must be able to start on an artefact
# with no prior interview. The scope is DECLARED (stage `mapping`) and CONTESTED
# (stage `refutation`); it is not negotiated before starting. `required` would
# block every autonomous run on a question whose answer is already in the
# repository — and an audit that waits for a human answer is no longer an audit,
# it is a meeting.
elucidation: none

# 1, never more: a subagent does not re-delegate itself indefinitely. Beyond
# that, nobody knows any more who launched what nor whom to blame for a failure
# (lint.cjs), and the bounded cascade of kybernos-delegation also caps at depth=1.
maxDepth: 1

stages:
  # Map BEFORE searching. Without this stage, every auditor rediscovers the scope
  # in its own way and two surfaces overlap or ignore each other in silence.
  #
  # The gate below expresses "map before searching": nothing starts before the
  # mapping is validated. An earlier revision of this file omitted it and claimed
  # the lint refused a gate without `inputs`, quoting "a gate that validates
  # nothing" — a message that does not exist in lint.cjs. The validator legalises
  # an entry-stage gate explicitly ("était refusée à tort") and emits a warning.
  # The declared dependency (`findings` does not start without `inputs: [mapping]`)
  # still carries the ordering, but ordering is not enforcement: no platform
  # primitive makes this gate bind. It is declared intent.
  - id: mapping
    roles: [cartographer]
    mode: once
    gate: true

  # `forEach` over the zones identified by the mapping: one auditor per
  # (surface × discipline), not one auditor for the whole repository. It is the
  # decomposition done by the mapping that decides the granularity of the audit;
  # freezing it in `once` would forbid the decomposition and drown every finding
  # in a monolithic report.
  #
  # Two disciplines in the same stage, and two different models: the code auditor
  # looks for behavioural defects, the security auditor sweeps an exposure
  # checklist (authentication bypass, fail-open, CORS, secrets, rate limiting,
  # injection, information leak). A single agent for both produces a code audit
  # with a decorative security section.
  #
  # `cap: 6`: the cap bounds the parallelism. Without it, N surfaces × 2
  # disciplines launch at once.
  - id: findings
    roles: [code-auditor, security-auditor]
    inputs: [mapping]
    mode: forEach
    cap: 6
    # DoD by COMMAND, never prose — a DoD not verifiable by command is not a DoD
    # (kybernos-delegation). These six commands prove that a finding is
    # ESTABLISHED, and not merely written:
    #   KYBER_RUN_DIR = run directory, SURFACE_ID = surface id,
    #   AUDIT_ROOT = root of the audited artefact (none of the three is
    #   optional; the artefact paths below follow from them).
    definitionOfDone:
      # 1. The surface delivered something. A silent audit is not a clean audit,
      #    it is an audit that did not take place.
      - >-
        test -s "$KYBER_RUN_DIR/findings/$SURFACE_ID.json"
      # 2. The audit is READ-ONLY (security-auditor: "you never modify the
      #    code"). The tree must be intact: that is the proof that the auditor
      #    reported instead of fixing.
      - >-
        test -z "$(git -C "$AUDIT_ROOT" status --porcelain)"
      # 3. Output shape: a JSON array, even empty. A healthy surface may
      #    legitimately produce nothing; it cannot produce anything other than an
      #    array.
      - >-
        jq -e 'type == "array"' "$KYBER_RUN_DIR/findings/$SURFACE_ID.json" >/dev/null
      # 4. Finding schema: id, `file:line` anchor, severity in the closed
      #    taxonomy, non-empty impact and reproduction command. An anchor without
      #    a line number is not an anchor (kybernos-delegation: "never a bare
      #    file name").
      - >-
        jq -e 'all(.[]; (.id|length) > 0 and (.anchor|test("^[^:]+:[0-9]+(-[0-9]+)?$")) and (.severity == "critical" or .severity == "high" or .severity == "medium" or .severity == "low") and (.impact|length) > 0 and (.repro|length) > 0)' "$KYBER_RUN_DIR/findings/$SURFACE_ID.json" >/dev/null
      # 5. Red-first: every reproduction command MUST fail on the current tree. A
      #    reproduction that passes reproduces no defect — the finding is false
      #    and must not leave the stage. It is the only mechanical proof that a
      #    finding discriminates.
      - >-
        jq -r '.[].repro' "$KYBER_RUN_DIR/findings/$SURFACE_ID.json" | while IFS= read -r c; do if bash -c "$c"; then echo "passing repro, finding not established: $c"; exit 1; fi; done
      # 6. Reproducibility (tester: "same verdict every run"): two executions of
      #    the same reproduction give the same output. A non-deterministic finding
      #    is unusable both for the refuter and for the reader of the report.
      - >-
        jq -r '.[].repro' "$KYBER_RUN_DIR/findings/$SURFACE_ID.json" | while IFS= read -r c; do diff <(bash -c "$c" 2>&1 || true) <(bash -c "$c" 2>&1 || true) >/dev/null || { echo "non-deterministic repro: $c"; exit 1; }; done

  # The refutation stage. `adversarial: true` is what sets it apart from an
  # ordinary stage: its work is to destroy, not to produce. It receives the
  # findings in `inputs` — without a target a refuter is nothing — and its gate
  # keeps the report from leaving before the refutation has returned its
  # verdicts.
  - id: refutation
    roles: [refuter]
    inputs: [findings]
    mode: once
    adversarial: true
    gate: true

  # The report. It depends on BOTH stages: reading only the findings would amount
  # to publishing what the refutation set aside, that is, to removing the only
  # thing this team brings.
  - id: report
    roles: [reporter]
    inputs: [findings, refutation]
    mode: once
    definitionOfDone:
      # The deliverable exists and is not empty (presenter: "confirm the file
      # exists and is non-empty before delivering").
      - >-
        test -s "$KYBER_RUN_DIR/AUDIT-REPORT.md"
      # "Set the refuted findings aside in an appendix" is a mechanical
      # invariant, not an intention: every refuted finding is present under
      # `## Appendix`, and NO refuted finding appears in the body. A finding set
      # aside in silence will be redone by someone.
      - >-
        jq -r '.[] | select(.verdict == "refuted") | .id' "$KYBER_RUN_DIR/refutation.json" | while IFS= read -r id; do sed -n '/^## Appendix/,$p' "$KYBER_RUN_DIR/AUDIT-REPORT.md" | grep -q "$id" || { echo "refuted finding outside the appendix: $id"; exit 1; }; if sed -n '1,/^## Appendix/p' "$KYBER_RUN_DIR/AUDIT-REPORT.md" | grep -q "$id"; then echo "refuted finding cited in the body: $id"; exit 1; fi; done

# `id` and `role` are NOT redundant: `kyber-memory` keys its learning entry on
# the role's `id`. The refuter therefore carries the `checker` specialty,
# distinct from `auditor` — declaring both with `auditor` would create ONE SINGLE
# arm for two opposing lines of work, and a preference learned on the auditor
# side would apply in silence to the refuter whose work is to contradict it. That
# happened on a real run (INSTALL.md §1).
roles:
  - id: cartographer
    role: scout
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You are the cartographer of the audit team. You do not judge, you do not
      rank, you do not assign severity: you establish the scope and you return a
      LIST OF SURFACES, one per entry, each with a short kebab-case identifier,
      the exact paths it covers, its entry point, and what is explicitly excluded
      from it. A fuzzy surface produces a fuzzy audit: "the src folder" is not a
      surface, "coeur-mcp: the handlers exposed by serveur.ts" is one. Your
      report obeys the scout output contract: verbatim excerpts anchored
      `file:line`, never prose summaries — a mapping report without an anchor is
      a FAILED report, it will be sent back. You are forbidden to conclude
      anything about the quality or the security of what you inventory, to open
      files outside the requested scope, and to assign a priority: that is not
      your stage.

  - id: code-auditor
    role: auditor
    needs: { modality: text, tier: balanced, context: standard }
    provider: zai-coding-cn
    model: glm-5.3
    prompt: >-
      You are the code auditor. You audit THE surface you are given, and it
      alone: what you notice outside its scope, you list separately under
      "out of scope", you do not audit it. You look for real defects — bug,
      flaw, gap between the announced contract and the behaviour, configuration
      drift — and nothing else: this is not a style review. Every finding carries
      an `id`, a `severity` (`critical` | `high` | `medium` | `low`), an `anchor`
      `file:line`, a concrete `impact` in one sentence, the exact command that
      reproduces the defect as `repro`, and a minimal fix PROPOSED but never
      applied. The reproduction is your proof: you run it, you verify that it
      FAILS on the current tree, you copy its failure output and you run it twice
      to verify that it is deterministic. A command that already passes proves no
      defect: the finding is false, you withdraw it instead of weakening it.
      Fail-closed: if you cannot verify, you write `unverified` and you report it
      — you never declare a point healthy by default. You are forbidden to
      modify, format or fix a single file (the audit is read-only and that is
      verified), to produce a finding without a resolving anchor, to count the
      same cause twice, and to narrate your process.

  - id: security-auditor
    role: security-auditor
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You are the security auditor, adversarial and READ-ONLY: you report, you
      never modify the code. Your minimum checklist: authentication bypass
      (every inventoried route, alternative methods GET/POST/PUT/DELETE/OPTIONS,
      errors returned before the access check); fail-open (environment variable
      absent, empty or misspelled — what happens THEN?); CORS (preflight, null
      origin, credentials, wildcard origins); hard-coded secrets, in the logs or
      in the API responses; rate limiting (amplification, costly and anonymous
      entry points); SQL, RAG and prompt injection; information leak (filesystem
      paths, internal configuration, execution traces). You return one verdict
      per surface — PASS | PASS-WITH-NOTES | FAIL — and, per flaw: an `anchor`
      `file:line`, a CONCRETE exploit scenario in the form of a command executed
      and copied together with its output as `repro`, a `severity`, a minimal
      fix. Severity mapping for this team: blocker → critical, major → high,
      minor → low. An incomplete report is acceptable, an empty report is not:
      you deliver the observed state AND what remains to be covered. You are
      forbidden to modify the code, to launch a destructive load against a target
      that is not in the authorised scope, to announce a flaw you have not
      reproduced, and to present an untested hypothesis as a finding.

  - id: refuter
    role: checker
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: kimi-k3
    prompt: >-
      You are the refuter: an adversarial re-reader whose work is to DESTROY, not
      to produce. For every finding you are given, you actively try to break it:
      an anchor that does not resolve, a reproduction command that passes (hence
      not discriminating), a case impossible in practice, an upstream protection
      that makes the path unreachable, a known false positive, a misreading of
      the code. Re-anchoring, hard invariant: your only material is the anchor,
      the reproduction command and the audited artefact. You NEVER receive and
      never ask for the auditor's reasoning or narration; if it appears, you
      ignore it — it can only anchor you. You judge every finding INDEPENDENTLY
      of the others: one finding holding says nothing about the next one.
      Fail-closed: anchor not found, command not executable, output not
      reproducible or command that passes → the finding is REFUTED; there is no
      implicit PASS, and a finding you have not reopened yourself is never
      confirmed. Per finding you return a verdict —
      `confirmed` | `weakened` | `refuted` — and for every refuted finding the
      dominant reason, tagged: `dead-anchor`, `passing-repro`, `false-premise` or
      `upstream-protection`. Circuit breaker: if more than a third of the
      findings are refuted, you write it at the head of your verdict — this is
      not a cosmetic detail, it says that the findings stage of this surface is
      not reliable, and the report must carry it. You are forbidden to produce a
      new finding, to propose a fix, and to reword a finding to make it more
      easily refutable.

  - id: reporter
    role: presenter
    needs: { modality: text, tier: balanced, context: standard }
    provider: zai-coding-cn
    model: GLM-5.3-Flash
    prompt: >-
      You are the reporter. You produce a DELIVERABLE, not the description of a
      deliverable: a written report, self-contained, understandable by someone
      who has not seen the audit, deposited in the run directory and verified
      non-empty before it is announced. You write only from the findings that
      SURVIVED refutation — confirmed, and weakened ones marked as such. Order of
      the body: what breaks (critical, high), then what exposes (security), then
      what costs (medium, low). Every entry repeats the `file:line` anchor, the
      impact, the reproduction command — the reader must be able to relaunch it
      themselves — and the proposed fix. REFUTED findings are set aside from the
      body and gathered in an appendix under a heading `## Appendix`, one entry
      per finding with the reason for its refutation: a finding set aside in
      silence is a finding someone will redo. You are forbidden to add a finding
      of your own invention, to soften a severity, to cite a refuted finding in
      the body of the report, to conclude beyond what the findings carry, and to
      deliver an empty or hole-ridden report: if a surface returned nothing, you
      name the missing surface, you do not invent its content.

# Append-only journal of the runs + a score learned per (role, model). The
# learning key rests on the role's `id`: that is why `verifier` and `auditor` do
# NOT share the same specialty above.
memory: audit

# Loaded on demand, in this order of use: the shape of the team (why an
# adversarial stage and not a pipeline), the provider/model resolution, then the
# learned memory (lessons distilled when an expectation was contradicted — the
# typical case being a refuted finding).
skills:
  - kyber-topology
  - kyber-routing
  - kyber-memory

# Connector requirements: NONE. This audit works on the local artefact with the
# tools of the preset (read, search, shell, jq, git). Do not declare a connector
# the kyber does not need: on another platform, every declared `tools:` must be
# installed or reported as unavailable.
tools: []
