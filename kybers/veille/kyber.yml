# veille — a watch team: monitor a domain, detect what changes, and produce a
# written digest that separates signal from noise.
#
# This kyber is the transposition of the domain template `market-watch`
# (kybernos/core/templates/kyber-domains/market-watch.md): copied, never linked,
# condensed, and rendered in English — it was first written in French. Its
# derivation is recorded nowhere else, and that is a gap worth flagging:
# `provenance` is reserved for the installer ("Filled in by the installer, never
# by the author", lint.cjs), and `sourcePath` designates the origin folder of an
# installed kyber, not the doctrine it derives from. Hence this comment, which
# only a human can read.

id: veille
specVersion: 2

mission: >-
  Monitor a corpus of sources confirmed by the human, detect what has materially
  changed, then produce a written deliverable that separates signal from noise,
  cites every claim and names what it discarded. Do not interrogate the market
  in the sponsor's place, collect nothing before having interrogated them, and
  never return a digest without a dated source.

# ELUCIDATION — the most important field of this kyber.
#
# The market-watch template opens on a prohibition, in capitals:
#   "HARD MANDATE: before composing any team, roles, or tools, interrogate the
#     user. Never compose on assumptions — every choice below must trace to an
#     explicit answer."
# Ten questions follow, and the team is composed only AFTER. `elucidation:
# required` carries exactly that requirement: the orchestrator MUST interrogate
# the human before composing the team (CHANGELOG, SPEC-VERSION 2). Setting it to
# `none` would empty this kyber of its doctrine — a watch composed on
# assumptions monitors the wrong sources, at the wrong cadence, and returns a
# digest nobody was waiting for.
#
# What this field does NOT carry, and which therefore had to live elsewhere:
#   - the TEN QUESTIONS: no field of the format holds them. They live in the
#     prompt of the `framer` role, the only executable place.
#   - WHERE THE ANSWERS GO: no field says it. I had to invent a file contract
#     ($RUN/framing.md) and make it verifiable through the `definitionOfDone` of
#     the `framing` stage.
#   - the ORDER "no collection before the interview": carried by `gate: true` on
#     the `framing` stage. Note what that gate does and does not do — no platform
#     primitive enforces it, so it is declared intent, not a binding constraint.
elucidation: required

# Recursion guard: 1. A collector that re-delegates to a sub-collector makes the
# attribution of a failure impossible — nobody knows any more which agent read
# what.
maxDepth: 1

# SHAPE: mapreduce, and not pipeline.
# A watch is the PARALLEL sweep of a LIST of sources — the watchlist that
# framing produces — followed by a reduction: N bulletins → one triage → one
# deliverable. That is the very definition of `mapreduce` in `kyber-topology`
# ("iteration over a list produced upstream"). `pipeline` would be dishonest:
# it describes one-to-one stages and says nothing about the fan-out over N
# sources, which is the heart of the work. The number of collectors is not known
# when this file is written — it depends on the human's answers — and that is
# precisely why `mode: forEach` and `cap:` exist.
topology: mapreduce

stages:
  # STAGE 0 — the interview. It runs BEFORE everything else and has no `inputs`:
  # in mapreduce, it is the stage that produces the list the next stage iterates.
  # Without it, `collection` has nothing to walk — the dependency is real.
  - id: framing
    roles: [framer]
    mode: once
    gate: true
    # This DoD is what makes elucidation VERIFIABLE. `elucidation: required` says
    # the human must be interrogated; these commands prove that the interview
    # took place and that its answers are written down somewhere.
    # File contract, for lack of a field to declare it:
    #   $RUN/framing.md — one "Q<n>: <question>" line per question asked, one
    #   "R<n>: <answer>" line per answer RECEIVED (the human's answer, not an
    #   agent hypothesis), then "SOURCE: <url>" per confirmed source and
    #   "ALERT-LEVEL: <what triggers an alert>".
    # The orchestrator exports RUN — e.g. RUN=veille/runs/2026-09-16T19-30Z.
    definitionOfDone:
      - >-
        test -s "$RUN/framing.md"
      - >-
        test "$(grep -cE '^R[0-9]+: .' "$RUN/framing.md")" -ge 10
      - >-
        test "$(grep -cE '^SOURCE: ' "$RUN/framing.md")" -ge 1
      - >-
        test "$(grep -cE '^ALERT-LEVEL: ' "$RUN/framing.md")" -ge 1

  # STAGE 1 — the sweep: `forEach` over the confirmed watchlist, capped.
  - id: collection
    roles: [official-collector, weak-signal-collector]
    mode: forEach
    inputs: [framing]
    # Ceiling of 6 simultaneous agents: this is the hard cap of the orchestration
    # doctrine (CHANGELOG, SPEC-VERSION 2: "Taken from the hard cap at 6").
    # Without `cap`, nothing bounds parallelism: 40 confirmed sources would
    # launch 40 agents, for a domain that no watch asks to cover in one pass.
    cap: 6
    # The two collectors share THIS stage, and that is not a shortcut: a single
    # role `id` can be reached by one stage only (lint.cjs), and both do the same
    # work — sweeping one source — over two families of sources. The orchestrator
    # routes each source to the one whose family matches. Their `id`s differ
    # because the learning key of kyber-memory is (kyber, id, provider, model):
    # two trades, two arms.
    definitionOfDone:
      # "Was a source really consulted?" The only acceptable answer is a
      # collection receipt, not a sentence. Contract, a pair of files per swept
      # source:
      #   $RUN/collection/<source-id>.json   bulletin of dated facts + citations[]
      #   $RUN/collection/<source-id>.fetch  receipt, 1st line:
      #     <HTTP code> <sha256 of the body> <ISO-8601 timestamp> <URL called>
      - >-
        test -n "$(ls -1 $RUN/collection/*.json 2>/dev/null)"
      - >-
        test "$(ls -1 $RUN/collection/*.json 2>/dev/null | wc -l)" -eq "$(ls -1 $RUN/collection/*.fetch 2>/dev/null | wc -l)"
      # Every receipt attests an HTTP 200. An unreachable source REPORTS itself
      # and fails the DoD: it is never replaced by a memory of the model.
      - >-
        test "$(grep -lE '^200 ' $RUN/collection/*.fetch 2>/dev/null | wc -l)" -eq "$(ls -1 $RUN/collection/*.fetch 2>/dev/null | wc -l)"
      # Every bulletin carries at least one citation: a bulletin without a
      # citation is a summary from memory, not a collection.
      - >-
        test "$(grep -l citations $RUN/collection/*.json 2>/dev/null | wc -l)" -eq "$(ls -1 $RUN/collection/*.json 2>/dev/null | wc -l)"
      # No source of the watchlist was skipped in silence: as many bulletins as
      # "SOURCE:" lines confirmed at the framing stage.
      - >-
        test "$(ls -1 $RUN/collection/*.json 2>/dev/null | wc -l)" -eq "$(grep -cE '^SOURCE: ' $RUN/framing.md)"

  # STAGE 2 — the triage. The only reduction of the watch: N bulletins → one
  # ranked list. This is where signal separates from noise, and the last place
  # where throwing noise away does not yet cost a line of deliverable.
  - id: triage
    roles: [signal-analyst]
    mode: once
    inputs: [collection]
    # This gate guards the composition. The doctrine's more important gate —
    # "no collection before the interview" — sits upstream on `framing`.
    #
    # An earlier revision of this file left the entry gate out and justified it
    # with a quotation from lint.cjs ("gate without inputs — a gate that
    # validates nothing") that DOES NOT EXIST. lint.cjs legalises an entry-stage
    # gate explicitly — its own comment reads "était refusée à tort" — and emits
    # only a warning. The premise was false, so the gate was moved back to where
    # the doctrine places it.
    #
    # What remains true: no platform primitive enforces a gate. Neither this one
    # nor the entry gate can stop a stage; both are auditable intent only.
    gate: true
    definitionOfDone:
      # $RUN/triage.jsonl — one JSON line per candidate:
      #   id, source, verdict (signal | watch | noise), reason, citations
      - >-
        test -s "$RUN/triage.jsonl"
      # Every line carries a verdict: as many `verdict` as non-empty lines.
      # An unranked candidate is a candidate that will pass into the digest.
      - >-
        test "$(grep -c verdict $RUN/triage.jsonl)" -eq "$(grep -c . $RUN/triage.jsonl)"
      # A ranking without a written reason is not verifiable: as many `reason` as
      # `verdict`. That is also what prevents throwing away in silence.
      - >-
        test "$(grep -c reason $RUN/triage.jsonl)" -eq "$(grep -c verdict $RUN/triage.jsonl)"

  # STAGE 3 — the deliverable. A FILE, not a chat answer: a digest that exists
  # only in the chat is not reread at the next cycle and is not compared with the
  # previous one ("tracks what changed since last cycle", market-watch).
  - id: synthesis
    roles: [synthesizer]
    mode: once
    inputs: [triage]
    definitionOfDone:
      - >-
        test -s "$RUN/digest.md"
      # The three sections, once each: the signal first ("the most actionable
      # signals surfaced first", market-watch), then what is rising, then what
      # was discarded — a deliverable that does not say what it threw away does
      # not prove that it triaged.
      - >-
        test "$(grep -cE '^## (Signal|Watch|Discarded)$' "$RUN/digest.md")" -eq 3
      # Every claim carries its source: without a citation, it is no longer a
      # watch deliverable, it is an opinion.
      - >-
        test "$(grep -cE '\[source: ' "$RUN/digest.md")" -ge 2

roles:
  # The role that interrogates and frames: THIS one carries the elucidation. The
  # ten questions of the market-watch template are copied into its prompt, for
  # lack of a field to hold them — condensing them further would mean losing
  # question 9 ("must-know-now" versus background noise), which is the very
  # definition of this team's triage work.
  - id: framer
    role: business-analyst
    needs: { modality: text, tier: balanced, context: standard }
    provider: zai-coding-cn
    model: glm-5.3
    prompt: >-
      You ARE the framer of a watch: before a single agent collects anything, you
      interrogate the human and you write nothing before their answer. You ask
      these ten questions, and you wait: 1) which market or sector, and which
      geographical area; 2) which competitors to monitor — direct, indirect,
      aspirants; 3) what to know about them — price, product, positioning,
      moves; 4) which customer or demand signals matter — reviews, mentions,
      search trends; 5) which sources to monitor — press, social networks,
      reviews, job postings, patents; 6) which cadence — daily, weekly, monthly
      — and what triggers an alert; 7) which decisions this intelligence serves
      — pricing, roadmap, positioning; 8) what is already monitored, and where
      that lives today; 9) what is a "must know right now" and what is
      background noise; 10) what the measure of success is — an early alert,
      a price datum, or a complete view. You PRODUCE $RUN/framing.md: one
      "Q<n>: <question>" line per question asked, one "R<n>: <answer>" line per
      answer received, then "SOURCE: <url>" per confirmed source, the cadence,
      and "ALERT-LEVEL: " for the must-know-now threshold. You FORBID yourself
      to compose a team, to choose a tool or to launch a collection before
      having these answers; a question without an answer stays open and you say
      so — you never fill it with a hypothesis, however plausible.

  # Two collectors, a single `scout` specialty, two `id`s: they do the same trade
  # over two families of sources, and it is the `id` that carries the learning
  # key (kyber-memory), not the specialty.
  - id: official-collector
    role: scout
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You ARE the collector of official and structured sources: price pages,
      press releases, regulatory filings, release notes, job postings, patents.
      You receive ONE source from the confirmed watchlist and you do not leave
      it: another source is another agent. You PRODUCE
      $RUN/collection/<source-id>.json — DATED facts, each with its URL and its
      publication date, plus a citations[] array of exact textual excerpts — and
      $RUN/collection/<source-id>.fetch, whose first line is
      "<HTTP code> <sha256 of the downloaded body> <ISO-8601 timestamp> <URL
      called>". You FORBID yourself to write a fact you have not read in the
      downloaded body: an unreachable source reports itself through a missing or
      non-200 receipt and is never completed from memory, and a reworded home
      page is not a fact.

  - id: weak-signal-collector
    role: scout
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: glm-5.3-flash
    prompt: >-
      You ARE the collector of weak signals: customer reviews, forums, social
      networks, app ratings, job-posting threads, blog posts by secondary
      players. You receive ONE source from the confirmed watchlist and you do
      not leave it. You PRODUCE the same file contract as the official collector
      — $RUN/collection/<source-id>.json (dated facts + citations[]) and
      $RUN/collection/<source-id>.fetch (collection receipt) — and nothing else.
      You FORBID yourself to count mentions without reading them, to present a
      spike in volume as a change, and to conclude a trend from a single
      testimony: you return dated citations, the trend is decided at the triage
      stage, not by you.

  # The analyst is the triage: it collects nothing, it writes nothing.
  - id: signal-analyst
    role: analyst
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: kimi-k3
    prompt: >-
      You ARE the signal analyst of a watch: you receive the collection bulletins
      and the framing, and you separate what counts from what does not count. A
      material change is a NEW fact, dated, that contradicts or displaces what
      the framing says about the market — a price that moves, a launch, a
      funding round, a departure, a stock-out, a positioning that changes
      target. You PRODUCE $RUN/triage.jsonl, one JSON line per candidate: id,
      source, verdict (signal | watch | noise), reason, citations. You FORBID
      yourself to rank without a written reason, to promote a rewording or a
      press release with no effect into a signal, to leave a candidate unranked,
      and to throw away in silence: everything you discard stays in the file,
      with the verdict noise, so that the deliverable can say what was rejected
      and why.

  # The synthesizer writes the deliverable. It does not re-triage, it does not
  # collect.
  - id: synthesizer
    role: presenter
    needs: { modality: text, tier: balanced, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You ARE the synthesizer of a watch: you write the deliverable, you collect
      nothing and you re-rank nothing — if a verdict looks wrong to you, you
      flag it, you do not correct it yourself. You PRODUCE $RUN/digest.md, a
      file — never a chat answer — with exactly three sections: "## Signal"
      (what must be known now, the most actionable first), "## Watch" (what is
      rising, without urgency), and "## Discarded" (what the triage rejected,
      and why). Every claim carries its citation [source: <id>] and its date,
      and you distinguish the observed from the inferred. You FORBID yourself to
      add a fact absent from triage.jsonl, to drown the signal under volume, and
      to conclude in the human's place: you write what changed and what it calls
      into question, not the decision to be taken.

memory: veille

# The common engine, not business skills: the format refuses a skill it cannot
# find, and the only natural business skill here — a `veille-sources` that would
# say which sources to monitor and at what cadence — does not exist yet.
# It cannot be declared without a second file in
# kybers/veille/skills/veille-sources/SKILL.md. Until then, that knowledge lives
# in the `framer` prompt, where it is natural language addressed to a tooled
# agent, hence reread by nobody.
skills:
  - kyber-topology
  - kyber-routing
  - kyber-memory

# Connector needs: NONE, and that is a decision, not an oversight.
# The market-watch template is explicit: "Composio connections, proposed per
# need — never pre-wired", and the sandbox alone is proposed "ONLY if custom
# code or scraping is justified ... propose it only once the sources and
# frequency are confirmed, never before". Declaring a press, social or messaging
# connector here would contradict stage 0: it is the human's answers that decide
# which sources exist, hence which connectors are needed.
# Consequence to own: at installation, the collectors have only the tools of the
# preset (read, search, shell, network) — and it is the DoD of `collection` that
# proves they really reached a source, not a declaration.
tools: []
