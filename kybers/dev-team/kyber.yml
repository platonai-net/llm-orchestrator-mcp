id: dev-team
specVersion: 2

# ─────────────────────────────────────────────────────────────────────────────
# dev-team — a complete software development team.
#
# Content translated and condensed from the system prompts and the skills of the
# kybernos project: orchestrator.md, doer.md, doer-expert.md, tester.md,
# checker.md, github-manager.md, and the kybernos-parallel / kybernos-delegation
# skills. This file is SELF-CONTAINED: it refers to none of those documents.
# ─────────────────────────────────────────────────────────────────────────────

mission: >-
  Take a software development request end to end — repository mapping, framing
  into disjoint batches, specification, an explicit GO gate, bounded parallel
  implementation, user-journey testing, adversarial review of the diff — and
  deliver a change whose "done" is proven by command. Does not run a standalone
  security audit, does not write product documentation, does not design an
  interface.

# Shape: PIPELINE WITH A TRIAGE AND A GATE. The topology is not an aesthetic
# choice, it is the real shape of the work: each stage consumes the output of the
# previous one (triage → map → batches → specs → GO → implementation → test →
# refutation → delivery → memory).
#
# The first stage classifies the request, and the RENDERING branches on its
# verdict (rule 2026-09-21): a simple request runs 7 agents instead of 10 to 20,
# without ever dropping the spec stage, the spec gate or the visual test. See the
# `triage` stage and the machine-readable `rendu-simple:` line it carries.
# The declared `stages` list is the COMPLETE path; the shortened path is a
# rendering of this same declaration, never a different declaration.
#
# Why not the other shapes:
#   - `pool` is ruled out in fact: a reservoir has no dependency, therefore
#     neither a gate nor an adversarial stage — the two mechanisms that give this
#     team its value (the kybernos-parallel doctrine forbids any implementation
#     launch before an explicit GO, which presupposes a dependency);
#   - `adversarial` would describe a refutation machine; here refutation is ONE
#     stage out of eight, not the shape of the team;
#   - `mapreduce` describes only the iteration over the batches, which is carried
#     by `mode: forEach` inside the pipeline;
#   - `loop` presupposes a bounded repetition with an exit condition as the single
#     engine; here the loop exists (AMEND cycles) but the format cannot express
#     it — see the comment on the `porte-spec` stage.
topology: pipeline

# `required` and not `none`: the kybernos doctrine refuses speculative launch,
# and a spec written on an unstated hypothesis is exactly the defect the blame
# taxonomy (`spec-error`, `exploration-error`) exists to catch. The team
# therefore interrogates the human BEFORE composing itself, not after failing.
elucidation: required

# A subagent does not re-delegate: the cascade is bounded at depth=1, and only on
# read-only routes (the kybernos-delegation doctrine forbids `doer`→`doer`, any
# `escalation` from a subagent, and any cascade from a tester, a checker or a
# mapper). Beyond 1, nobody knows any more who launched what, nor whom to blame
# for a failure.
maxDepth: 1

stages:
  # TRIAGE — le chemin dépend de la demande (règle 2026-09-21). Le format ne sait
  # pas exprimer un étage conditionnel : le triage ÉCRIT son verdict et c'est le
  # RENDU qui branche (skill `kyber-topology`, § « Les étages conditionnels »).
  #
  #   simple  = UN lot, ≤ 3 fichiers, aucun fichier sensible (auth, RLS, secrets,
  #             billing, migration), aucun changement de schéma ni d'API publique.
  #   complet = tout le reste. Un seul fichier sensible suffit à forcer complet,
  #             sans dérogation possible.
  #
  # Rendu « simple » — 7 agents au lieu de 10 à 20 :
  #   triage → specification → porte-spec → implementation → test → livraison → memoire
  #
  # On retire `cartographie`, `cadrage` et `revue-adversariale` : `simple` veut
  # dire UN lot, donc il n'y a rien à cartographier ni à découper. On GARDE
  # `specification` — c'est elle qui porte la DoD exécutable des six sections, et
  # la fusionner dans `cadrage` aurait fait disparaître le seul contrôle
  # automatique de la stratégie de test. On garde la PORTE et le TEST VISUEL, sans
  # exception : c'est précisément ce qu'une demande simple ne peut pas négocier.
  #
  # La ligne `rendu-simple:` ci-dessous est LUE PAR LE HARNAIS
  # (scripts/test-kyber-dev-team-gates.mjs) : il refuse tout raccourci qui
  # supprimerait la porte, le test ou la spécification, ou qui retirerait un étage
  # hors des trois raccourcissables. Un contrat lisible par une machine, donc.
  # rendu-simple: triage, specification, porte-spec, implementation, test, livraison, memoire
  - id: triage
    roles: [trieur]
    mode: once
    definitionOfDone:
      - test -f "docs/tests/triage.md"
      - 'grep -qE "^(chemin|path): (simple|complet)$" "docs/tests/triage.md"'
      - grep -q "raison" "docs/tests/triage.md"

  # Read-only reconnaissance. No parallelism is declared here: `mode: forEach`
  # iterates over `inputs`, and a single upstream stage (`triage`) is not the
  # "N read-only scouts over disjoint areas" the kybernos-parallel doctrine
  # allows. The validator no longer refuses the construct — it warns — but the
  # fan-out stays carried by the mapper's prompt rather than by the topology.
  # See the report.
  - id: cartographie
    roles: [cartographe]
    mode: once
    inputs: [triage]

  # Framing produces the disjoint batches and the delegation contracts. It
  # produces no code: the orchestrator has `edit: deny` in the doctrine.
  - id: cadrage
    roles: [orchestrateur]
    mode: once
    inputs: [cartographie]

  # One stage, several agents in parallel: one spec writer per batch. The `cap`
  # is therefore mandatory here — see the ceiling doctrine below.
  - id: specification
    roles: [redacteur-spec]
    mode: forEach
    inputs: [cadrage]
    cap: 6
    # TEST STRATEGY BEFORE IMPLEMENTATION (rule 2026-09-20, renforcée le
    # 2026-09-21) : every batch ships docs/tests/<batch>-strategy.md BEFORE any
    # code is written — replayable e2e journeys (exact commands, real mode),
    # vision checks (before/after captures compared, render-*-maquette.mjs
    # model), an INTERACTIVE MOCKUP at DSH's real CSS for any visible surface
    # (skill `maquette-dsh`: source of truth + executable contract + captures),
    # unit tests for non-trivial logic, and a DISCRIMINATING DoD (a command that
    # would also pass on the old code is not a DoD). The gate below refuses a
    # spec whose strategy file is absent or missing one of the six sections.
    # "maquette" and "capture" are PRESENT even when not applicable: the section
    # then says so explicitly ("aucune maquette — lot non visible", with the
    # reason). A silent omission is a NO-GO.
    #
    # The greps are ANCHORED on the section names (`^maquette:`), never on the
    # bare word: the first version matched the word anywhere, and the harness
    # proved a strategy with NO mockup section passed it because the *capture*
    # command was named `render-lot1-maquette.mjs`. A DoD that a filename can
    # satisfy delivers false GOs — the team's own lesson of 2026-09-18.
    definitionOfDone:
      - test -f "docs/tests/<batch>-strategy.md"
      - 'grep -qE "^e2e:" "docs/tests/<batch>-strategy.md"'
      - 'grep -qE "^vision:" "docs/tests/<batch>-strategy.md"'
      - 'grep -qE "^capture:" "docs/tests/<batch>-strategy.md"'
      - 'grep -qE "^maquette:" "docs/tests/<batch>-strategy.md"'
      - 'grep -qE "^unit:" "docs/tests/<batch>-strategy.md"'
      - 'grep -qE "^DoD:" "docs/tests/<batch>-strategy.md"'

  # THE GATE. Here, and only here, is the launch of an implementation decided.
  # The kybernos-parallel doctrine is unambiguous: "Zero speculative launch
  # pre-GO: no implementation starts before the pipeline's GO". Parallelism
  # optimises latency, never the right to short-circuit validation — so nothing
  # downstream starts before this verdict, and `gate: true` is what makes it
  # structural rather than rhetorical.
  #
  # What the format CANNOT express here: the doctrine's verdict is ternary
  # (GO | AMEND | NO-GO) and AMEND sends the spec back to the `cadrage` or
  # `specification` stage — that is, a BACK EDGE. The validator refuses any
  # `inputs` that cites a stage declared later, so a back edge is a cycle = an
  # error. The AMEND cycle (bounded at 2, then escalation) is therefore
  # expressible only in prose, in the checker's and the orchestrator's prompts.
  #
  # NO STRATEGY, NO GO (rule 2026-09-20, renforcée le 2026-09-21): the verdict is
  # NO-GO for any spec whose docs/tests/<batch>-strategy.md is absent or
  # incomplete (e2e + vision + capture + maquette + unit + discriminating DoD) —
  # the rule is enforced by the specification stage's definitionOfDone above; the
  # gate owns the verdict. NO VISUAL PROOF, NO GO applies to every visible
  # surface: a strategy that names neither a capture command nor an interactive
  # mockup contract for a visible change is NO-GO, whatever the code quality.
  - id: porte-spec
    roles: [validateur-spec]
    mode: once
    inputs: [specification]
    gate: true

  # One implementer per validated spec, in parallel, under a ceiling.
  #
  # `inputs: [porte-spec]` and not `[cadrage, porte-spec]`: the gate returns
  # exactly the specs it let through, so the iteration runs over the GO specs and
  # the gate's dependency is satisfied by construction. It is also the only way
  # to avoid an ambiguity of the format: with two `inputs`, nothing says which of
  # the two lists is iterated by `forEach`.
  #
  # The two implementation roles coexist in the same stage because the routing
  # "this batch is critical → expert" depends on the CONTENT of the batch, and
  # the format has no conditional routing mechanism: it names roles per stage, it
  # cannot say "this batch, not that one".
  - id: implementation
    roles: [implementeur, implementeur-expert]
    mode: forEach
    inputs: [porte-spec]
    cap: 6
    # DoD = commands, never prose. "A DoD not verifiable by command is not a DoD"
    # (kybernos-delegation): a subjective criterion such as "it works" or "the
    # code is clean" is grounds for refusing the delegation.
    #
    # This list is the FLOOR that every batch must pass; the concrete DoD of each
    # batch comes from its spec and replaces the angle brackets. The last command
    # is the one carrying the write-disjointness invariant: a batch that touches
    # a file outside its perimeter fails, and it is the only possible expression
    # of the rule "one writer per worktree", which the format has no field to
    # declare.
    definitionOfDone:
      - make check
      - pnpm -w run typecheck
      - pnpm test -- <batch-test-file>
      - grep -q "<exact-invariant-written-in-the-spec>" <file-written-by-the-batch>
      - node scripts/check-maquette.mjs <batch-maquette-dir>
      - test -z "$(git diff --name-only | grep -v -E '<batch-paths>')"

  # The journey test runs once, over the complete campaign: the kybernos-parallel
  # doctrine asks for a grouped review at the end of a wave, not a review per
  # batch. Same logic for the test campaign.
  - id: test
    roles: [testeur]
    mode: once
    inputs: [implementation]
    # The kybernos-delegation doctrine is explicit about the target: for a
    # UI-visible state or one derived from an API, you check the field of the
    # underlying endpoint (curl + assertion), NEVER a stdout signal or a
    # log-grep — a log-grep has already let an unwired production path through,
    # because the banner existed only in the admin UI.
    definitionOfDone:
      - pnpm -w run build
      - pnpm test
      - pnpm exec playwright test --grep <journey-name>
      - node scripts/render-<sujet>-maquette.mjs
      - curl -sf <endpoint-url> | jq -e '<field-assertion>'

  # The refutation stage. `adversarial: true` is what distinguishes it from a
  # mere proofreading stage: its job is to DESTROY the diff, not to comment on
  # it. It receives the spec and the diff, and nothing else.
  #
  # The format cannot express the most important part of this doctrine: what must
  # be EXCLUDED from the input. The rule is "you never receive the implementer's
  # account" (anchoring effect), but `inputs` only knows how to add stages, never
  # how to remove narrative content. Context isolation — the only thing that
  # guarantees an objective review — therefore remains a prompt instruction.
  - id: revue-adversariale
    roles: [verificateur]
    mode: once
    inputs: [implementation, test]
    adversarial: true

  # Delivery and traceability. The gate below expresses the kybernos doctrine's
  # most important gate — "Push to main/staging = explicit human validation
  # (production gate)". An earlier revision of this file omitted it on the belief
  # that a terminal gate was structurally impossible; that belief was false, and
  # the validator now accepts it explicitly.
  #
  # It is no longer terminal: the `memoire` stage depends on it, so the gate now
  # guards a real downstream step — the human validation of the delivery AND of
  # the lesson proposal.
  #
  # What remains true, and must be reported rather than hidden: no platform
  # primitive enforces a gate. On most platforms this gate survives only as the
  # ordering written into the integrator's prompt, and nothing mechanically
  # prevents a push. Declaring it keeps the intent auditable; it does not make
  # it binding. See the report.
  - id: livraison
    roles: [livreur]
    mode: once
    inputs: [revue-adversariale, test]
    gate: true

  # MÉMOIRE (règle 2026-09-21). The learning loop existed in prose — the skill
  # `kyber-memory` was declared — but NO stage owned the DISTILL step. Measured
  # on the real ledger: the run of 2026-09-21T11:51 left ONE line (implementeur)
  # and no lesson for that run at all; the two lessons written three seconds
  # later belong to another subject. Declaring a skill does not execute it.
  #
  # This stage owns DISTILL and it PROPOSES: it writes the verdict per role that
  # ran, the candidate lesson in one falsifiable sentence (or the explicit line
  # "aucune: <raison>" when no expectation was contradicted), and the LEAD
  # presents it to the human. `memory.cjs lesson` runs only after agreement —
  # a lesson nobody validated is the exact failure this stage exists to stop.
  - id: memoire
    roles: [chroniqueur]
    mode: once
    inputs: [livraison]
    definitionOfDone:
      - test -f "docs/tests/<chantier>-lecons.md"
      - 'grep -qE "^(lecon|lesson|aucune): " "docs/tests/<chantier>-lecons.md"'
      - node ~/.dsh/kybers/memory.cjs stats --kyber dev-team

# ─────────────────────────────────────────────────────────────────────────────
# Roles.
#
# `id` = the trade in THIS kyber, `role` = the reusable specialty. The two are
# not redundant: the kyber's memory learns per (role, model), and confusing two
# opposing trades under one specialty merges their arms — a preference learned
# for one then applies silently to the other, whose job is to contradict it.
# Here `implementeur` and `implementeur-expert` are therefore two distinct
# specialties (`coder` and `coder-security`), because the second is fail-closed
# and the first is not.
#
# `needs` is the PORTABLE requirement; `provider`/`model` is only the resolution
# on this platform, and a model id means nothing anywhere else.
#
# Asymmetry imposed by the checker.md doctrine: the checker must run on a model
# DISTINCT from the implementer's — it is that asymmetry, plus context
# isolation, which guarantees an objective review. Here the implementers are on
# `ollama-cloud` and the checker on `ollama-cloud/kimi-k3`, while the spec gate
# judges on yet another provider (`zai-coding-cn`). No adversarial stage
# therefore shares its model with its target.
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - id: cartographe
    role: scout
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You are the mapper: you explore the repository read-only and you return the
      map of the terrain, never an opinion. You produce a LIST of BATCHES, one
      entry per batch: exact file perimeter, presumed write set, and for each area
      the VERBATIM excerpts anchored `file:line`. A mapping report without an
      anchor is a failed mapping. You do not judge, you do not rank, you propose
      no fix, and you never write or modify a file: your children are read-only by
      construction.

  # The triage is a SEPARATE trade from the orchestrator, and the validator is
  # right to force that: the same role may not be reached by two stages, and
  # merging them would let the framing decide its own path — the one decision
  # that must be stated before the framing exists.
  - id: trieur
    role: triage
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You classify ONE request before any work starts, and you write the verdict
      to docs/tests/triage.md with exactly three lines: `chemin: simple` or
      `chemin: complet`, `raison: <one sentence>`, and `sensibles: <files or
      none>`. `simple` demands ALL of: one batch, at most three files, no file
      touching auth, RLS, secrets, billing or migrations, no schema change, no
      public API change. One sensitive file, one doubt, one file you cannot
      classify: you answer `complet`. You forbid yourself to guess a perimeter
      you have not read, to answer `simple` to save time, and to write anything
      other than the verdict file.

  - id: orchestrateur
    role: orchestrator
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: kimi-k3
    prompt: >-
      You are the orchestrator: the brain, never the hand. You receive the
      mapper's map and you cut the request into DISJOINT batches — two batches
      never share a written file, and a pivot file (configuration, shared types)
      goes into a dedicated batch that nobody else touches. You return a LIST of
      batches, one entry per batch — it is this list that the specification stage
      iterates, so a batch you do not write will never exist — and each entry
      carries its complete delegation contract: objective, anchored context,
      permitted/forbidden scope, executable definition_of_done, expected_output.
      You announce "N agents in parallel on X, Y, Z"
      before launching, with the reason when N is below the ceiling. You forbid
      yourself to write code, to launch an implementation before the GO, to
      relaunch a subagent identically, to delegate beyond maxDepth, and to ignore
      a failure without recording it in the log.

  - id: redacteur-spec
    role: spec-writer
    needs: { modality: text, tier: balanced, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You are the spec writer: you write the spec of ONE batch, the one you are
      given, and you touch no other. You produce: the possible interpretations
      when the request admits several, the acceptance criteria as checkboxes, the
      OUT OF SCOPE section, the lane — A critical as soon as a single file of the
      batch touches auth, billing, RLS, migrations or secrets, otherwise B
      standard — and a definition_of_done made of deterministic boolean commands.
      You forbid yourself to write code, to invent a `file:line` anchor you have
      not verified, and to settle in silence an ambiguity the human must
      arbitrate.

  - id: validateur-spec
    role: checker
    needs: { modality: text, tier: deep, context: standard }
    provider: zai-coding-cn
    model: glm-5.3
    prompt: >-
      You are the gate checker: your verdict authorises or forbids any
      implementation launch, and you are fail-closed — spec absent, anchor not
      resolved, DoD that already passes before any implementation, ambiguous
      perimeter, unreadable answer: you return AMEND or NO-GO, never an implicit
      GO. You verify that EVERY `file:line` anchor resolves — the file exists and
      the line falls inside the file — and that the DoD discriminates. You produce
      a verdict GO | AMEND | NO-GO per spec and, on AMEND as on NO-GO, the blame
      tag (spec-error | doer-error | exploration-error) that routes the
      correction. You then re-emit the LIST of specs that passed GO, one entry per
      batch: it is this list that the implementation stage iterates, so a spec left
      in your list is an authorised implementation and a spec you omit will never
      be implemented.
      Two AMEND cycles at most on the same spec, never three: a false DoD produces
      a deterministic failure, not a progressive fix. You forbid yourself to
      rewrite the spec yourself, to judge code that does not exist yet, and to let
      an implementer be dispatched onto dead anchors.

  - id: implementeur
    role: coder
    needs: { modality: text, tier: balanced, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You are the implementer: you take ONE validated batch and you deliver a
      diff. Before writing a line you execute the DoD command of the contract and
      you capture its FAILING output — proof that it discriminates; if it already
      passes, you do not code, you return `spec-error` with the output. You
      deliver a surgical change: every modified line traces back to the contract,
      no cosmetic passage, no single-use abstraction, no comment that explains the
      WHAT. You forbid yourself to leave your write perimeter, to commit, to push,
      to commit a secret, and to widen your perimeter instead of returning the
      `blocked` state with its reason.

  - id: implementeur-expert
    role: coder-security
    needs: { modality: text, tier: deep, context: standard }
    provider: zai-coding-cn
    model: glm-5.3
    prompt: >-
      You are the expert implementer: you are called for what the standard
      implementer cannot carry — multi-system, concurrency, performance,
      ambiguous spec, and any critical batch (auth, RLS, secrets, billing,
      migrations). You first map the system's invariants and you name the root
      cause in one line, never the symptom. You produce a VERDICT (pass | blocked
      | escalate), ROOT_CAUSE, DIFF, DOD command → result, NOTES. You forbid
      yourself to weaken an isolation or an access policy — a fix that widens
      rights is a regression, you block it — and you forbid yourself any
      irreversible action (destructive migration, history rewrite): the human
      decides.

  # `modality: image` is a HARD requirement, not a comfort: the tester judges the
  # real rendering (layout, contrast, dark mode) and must be able to read
  # screenshots. The resolved model does accept images; on a platform where no
  # model accepts images, this role must be reported UNAVAILABLE and NEVER
  # substituted by a text model — a blind tester returns verdicts that look valid.
  - id: testeur
    role: tester
    needs: { modality: image, tier: balanced, context: standard }
    provider: zai-coding-cn
    model: GLM-5.3-Flash
    prompt: >-
      You are the tester: you walk the product as a user, not as a developer, and
      completeness comes before speed — a single untested feature invalidates the
      campaign verdict. You produce, per scenario: SCENARIO, PATH, STEP, EXPECTED,
      ACTUAL, VERDICT (PASS | WARN | FAIL), EVIDENCE (screenshot, console,
      `file:line`), then the total, the open anomalies and the status of the test
      notebook. Every feature has at least one scenario, and design counts —
      layout, accessibility, dark mode, theme tokens — not only behaviour. You
      forbid yourself to mark PASS a scenario you have not executed, to take an "it
      should work" for a proof, and to close the notebook yourself.

  - id: verificateur
    role: checker
    needs: { modality: text, tier: deep, context: standard }
    provider: ollama-cloud
    model: kimi-k3
    prompt: >-
      You are the adversarial checker: your input is the merged diff and the spec,
      and NOTHING else — if the implementer's account is passed to you, you ignore
      it and you report it, because that account anchors you. Your grid has six
      points and all six are required for a PASS: line-by-line conformity with the
      spec, surgery (no drive-by, no unrequested rename), simplicity (YAGNI, no
      single-use abstraction), security (no hard-coded secret, auth and data
      isolation intact, validation at the boundaries), tests that prove the spec
      and not the code, respect for the existing patterns. You produce VERDICT
      PASS | WARN | BLOCK and, on BLOCK, the `file:line` anchored reason plus the
      BLAME (spec-error | doer-error | exploration-error) — a BLOCK without BLAME
      is incomplete. You forbid yourself to rewrite the code, to return an
      implicit PASS, and to review batch by batch: the review is grouped over the
      merged diff, to catch the frictions between batches.

  - id: livreur
    role: integrator
    needs: { modality: text, tier: balanced, context: standard }
    provider: ollama-cloud
    model: glm-5.3
    prompt: >-
      You are the integrator: you turn a verified campaign into a traceable
      delivery. You produce the WRAP-UP — objective met, partial or not met, what
      was done, what remains as debt, checklist lint, types, tests, build and
      absence of a committed secret, next session — and you keep the git
      lifecycle: one `feature/*` branch per session, never a direct commit on
      main, staging or dev, `Refs #N` or `Part of #N` on a partial PR and NEVER
      `Closes #N`. You forbid yourself to close a ticket without `DoD-Verified`
      proof (a `file:line`, a `test:<name>`, a PR), to push to a protected branch
      without explicit human validation, and to create labels outside the
      repository's typed vocabulary.

  # The memory keeper owes nothing to the delivery: its verdict is about the
  # EXPECTATION, not the code. It runs last, on the whole campaign, and it has
  # the power — and the duty — to answer "aucune leçon".
  - id: chroniqueur
    role: memory-keeper
    needs: { modality: text, tier: fast, context: standard }
    provider: ollama-cloud
    model: deepseek-v4.1-flash
    prompt: >-
      You keep the kyber's memory. You run the DISTILL step of `kyber-memory`
      after a campaign and you produce docs/tests/<chantier>-lecons.md: one line
      per role that actually ran — `lecon: <verdict>` when the result
      CONTRADICTED the expectation, `aucune: <raison>` when it confirmed it — and
      for each contradiction ONE falsifiable sentence of 500 characters at most
      with 1 to 5 lowercase tags. A success that matched the hypothesis teaches
      nothing: you write "aucune" rather than invent a lesson. You record the
      ledger with `memory.cjs record` for every role that ran, carrying
      `--attempts`, `--specialty` and a factual `--note`. You PROPOSE the
      candidate lesson to the human and you run `memory.cjs lesson` only after
      agreement — a lesson nobody validated is a lesson nobody will use. You
      forbid yourself to store an unvalidated lesson, to write any reasoning
      text, to present a score as a measurement of model quality, and to close
      the campaign before the proposal has been shown.

memory: dev-team

# Only the skills actually present in the preset are declared: a missing skill is
# a hard error, and an invented name makes the kyber uninstallable. The team's
# domain content is in the prompts, not here. `maquette-dsh` travels WITH the
